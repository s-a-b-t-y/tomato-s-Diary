<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Entry — Cutie Pie J&I</title>
  <link rel="icon" type="image/png" href="../../assets/icons/Logo.png">
  <script>
    (function() {
      var t = localStorage.getItem('tomato_diary_theme');
      if (t === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
    })();
  </script>
  <link rel="stylesheet" href="../../styles/shared/variables.css">
  <link rel="stylesheet" href="../../styles/shared/base.css">
  <link rel="stylesheet" href="../../styles/shared/animations.css">
  <link rel="stylesheet" href="../../styles/shared/utilities.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">

  <link rel="stylesheet" href="../../components/buttons/buttons.css">
  <link rel="stylesheet" href="../../components/toast/toast.css">
  <link rel="stylesheet" href="../../components/modals/modal.css">
  <link rel="stylesheet" href="../../components/loading/loading.css">
  <link rel="stylesheet" href="../../components/page-transition/page-transition.css">
  <link rel="stylesheet" href="view-entry.css">
</head>
<body>
  <div class="loading-screen" id="loadingScreen" role="status" aria-label="Loading">
    <div class="loading-screen__book">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="8" width="35" height="44" rx="4" fill="#1E2D4F" stroke="#5B9BD5" stroke-width="1.5"/>
        <rect x="15" y="8" width="35" height="44" rx="4" fill="#162040" stroke="#5B9BD5" stroke-width="1.5"/>
        <line x1="22" y1="20" x2="40" y2="20" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="28" x2="36" y2="28" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="36" x2="38" y2="36" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="loading-screen__text">
      Opening your memory
      <span class="loading-screen__dots"><span></span><span></span><span></span></span>
    </p>
  </div>

  <main class="page view-entry" id="app">
    <div class="container view-entry__inner">
      <a href="../entries/entries.html" class="view-entry__back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Past Notes
      </a>

      <article class="view-entry__paper animate-diary-open" id="entryContent">
        <header class="view-entry__header">
          <div class="view-entry__meta">
            <span class="view-entry__mood" id="entryMood"></span>
            <span class="view-entry__date" id="entryDate"></span>
            <span class="view-entry__mood-tag" id="entryMoodTag"></span>
          </div>
          <h1 class="view-entry__title" id="entryTitle"></h1>
        </header>

        <div class="view-entry__body">
          <p class="view-entry__content" id="entryText"></p>
        </div>

        <footer class="view-entry__footer">
          <span class="view-entry__reading-time" id="entryReadingTime"></span>
          <div class="view-entry__actions">
            <button class="btn btn--ghost btn--small" id="editBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              Edit
            </button>
            <button class="btn btn--ghost btn--small" id="deleteBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              Delete
            </button>
          </div>
        </footer>
      </article>
    </div>
  </main>

  <script src="../../utilities/helpers.js"></script>
  <script src="../../utilities/data.js"></script>
  <script src="../../utilities/service.js"></script>
  <script src="../../components/buttons/buttons.js"></script>
  <script src="../../components/navbar/navbar.js"></script>

  <script src="../../components/page-transition/page-transition.js"></script>
  <script src="../../components/toast/toast.js"></script>
  <script src="../../components/modals/modal.js"></script>
  <script src="view-entry.js"></script>
</body>
</html>
