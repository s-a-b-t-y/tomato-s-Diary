<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Notes — Cutie Pie J&I</title>
  <link rel="icon" type="image/png" href="../../assets/icons/Logo.png">
  <script>
    (function() {
      var t = localStorage.getItem('tomato_diary_theme');
      if (t === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
    })();
  </script>
  <link rel="stylesheet" href="../../styles/shared/variables.css">
  <link rel="stylesheet" href="../../styles/shared/base.css">
  <link rel="stylesheet" href="../../styles/shared/animations.css">
  <link rel="stylesheet" href="../../styles/shared/utilities.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">

  <link rel="stylesheet" href="../../components/buttons/buttons.css">
  <link rel="stylesheet" href="../../components/cards/diary-card.css">
  <link rel="stylesheet" href="../../components/empty-state/empty-state.css">
  <link rel="stylesheet" href="../../components/loading/loading.css">
  <link rel="stylesheet" href="../../components/page-transition/page-transition.css">
  <link rel="stylesheet" href="../../components/skeleton/skeleton.css">
  <link rel="stylesheet" href="entries.css">
  <link rel="stylesheet" href="mood-dropdown.css">
</head>
<body>
  <div class="loading-screen" id="loadingScreen" role="status" aria-label="Loading">
    <div class="loading-screen__book">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="8" width="35" height="44" rx="4" fill="#1E2D4F" stroke="#5B9BD5" stroke-width="1.5"/>
        <rect x="15" y="8" width="35" height="44" rx="4" fill="#162040" stroke="#5B9BD5" stroke-width="1.5"/>
        <line x1="22" y1="20" x2="40" y2="20" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="28" x2="36" y2="28" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="36" x2="38" y2="36" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="loading-screen__text">
      Gathering your memories
      <span class="loading-screen__dots"><span></span><span></span><span></span></span>
    </p>
  </div>

  <main class="page entries-page" id="app">
    <div class="container entries-page__inner">
      <div class="entries-page__header">
        <h1 class="entries-page__title">Your Memories</h1>
        <p class="entries-page__subtitle">Every page tells a story worth remembering</p>
      </div>

      <div class="entries-page__toolbar">
        <div class="entries-page__search" id="searchWrapper">
          <div class="form-search">
            <input type="search" class="form-search__input" id="searchInput" placeholder="Search your memories..." aria-label="Search past notes">
            <span class="form-search__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <button class="entries-page__search-clear" id="searchClear" type="button" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="entries-page__filters">
          <div class="entries-page__sort-dropdown" id="sortDropdown">
            <button class="entries-page__sort-trigger" id="sortTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Sort past notes">
              <svg class="entries-page__sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/></svg>
              <span class="entries-page__sort-label">Newest First</span>
              <svg class="entries-page__sort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="entries-page__sort-menu" id="sortMenu" role="listbox" aria-label="Sort options">
              <button class="entries-page__sort-option active" data-value="newest" role="option" aria-selected="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Newest First
              </button>
              <button class="entries-page__sort-option" data-value="oldest" role="option" aria-selected="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 8 14"/></svg>
                Oldest First
              </button>
              <button class="entries-page__sort-option" data-value="title" role="option" aria-selected="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                Title A-Z
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="entries-page__mood-filter" id="moodFilter">
        <div class="entries-page__mood-dropdown" id="moodDropdown">
          <button class="entries-page__mood-trigger" id="moodTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Filter by mood">
            <span class="entries-page__mood-trigger-emoji">🌈</span>
            <span class="entries-page__mood-trigger-label">All Moods</span>
            <svg class="entries-page__mood-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="entries-page__mood-menu" id="moodMenu" role="listbox" aria-label="Mood options">
            <button class="entries-page__mood-option active" data-mood="all" role="option" aria-selected="true">
              <span class="entries-page__mood-option-emoji">🌈</span>
              <span class="entries-page__mood-option-text">All Moods</span>
            </button>
          </div>
        </div>
      </div>

      <div class="entries-page__grid" id="entriesGrid"></div>

      <div class="entries-page__pagination" id="pagination"></div>

      <p class="entries-page__count" id="entriesCount"></p>
    </div>
  
  <div class="entries-page__search-overlay" id="searchOverlay">
    <div class="entries-page__search-floating">
      <div class="form-search">
        <input type="search" class="form-search__input" id="searchInputFloating" placeholder="Search your memories..." aria-label="Search past notes" autocomplete="off">
        <span class="form-search__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <button class="entries-page__search-clear" id="searchClearFloating" type="button" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <p class="entries-page__search-hint">Press <kbd>Esc</kbd> to close &middot; <kbd>Ctrl+K</kbd> to open</p>
    </div>
  </div>
</main>

  <script src="../../utilities/helpers.js"></script>
  <script src="../../utilities/data.js"></script>
  <script src="../../utilities/service.js"></script>
  <script src="../../components/buttons/buttons.js"></script>
  <script src="../../components/navbar/navbar.js"></script>

  <script src="../../components/page-transition/page-transition.js"></script>
  <script src="../../components/cards/diary-card.js"></script>
  <script src="../../components/empty-state/empty-state.js"></script>
  <script src="../../components/skeleton/skeleton.js"></script>
  <script src="entries.js"></script>
</body>
</html>
