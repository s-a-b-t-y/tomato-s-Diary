<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write — Cutie Pie J&I</title>
  <link rel="icon" type="image/png" href="../../assets/icons/Logo.png">
  <script>
    (function() {
      var t = localStorage.getItem('tomato_diary_theme');
      if (t === 'pink') document.documentElement.setAttribute('data-theme', 'pink');
    })();
  </script>
  <link rel="stylesheet" href="../../styles/shared/variables.css">
  <link rel="stylesheet" href="../../styles/shared/base.css">
  <link rel="stylesheet" href="../../styles/shared/animations.css">
  <link rel="stylesheet" href="../../styles/shared/utilities.css">
  <link rel="stylesheet" href="../../components/navbar/navbar.css">

  <link rel="stylesheet" href="../../components/buttons/buttons.css">
  <link rel="stylesheet" href="../../components/mood-selector/mood-selector.css">
  <link rel="stylesheet" href="../../components/toast/toast.css">
  <link rel="stylesheet" href="../../components/modals/modal.css">
  <link rel="stylesheet" href="../../components/loading/loading.css">
  <link rel="stylesheet" href="../../components/page-transition/page-transition.css">
  <link rel="stylesheet" href="../../components/date-picker/date-picker.css">
  <link rel="stylesheet" href="diary.css">
</head>
<body>
  <div class="loading-screen" id="loadingScreen" role="status" aria-label="Loading">
    <div class="loading-screen__book">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="8" width="35" height="44" rx="4" fill="#1E2D4F" stroke="#5B9BD5" stroke-width="1.5"/>
        <rect x="15" y="8" width="35" height="44" rx="4" fill="#162040" stroke="#5B9BD5" stroke-width="1.5"/>
        <line x1="22" y1="20" x2="40" y2="20" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="28" x2="36" y2="28" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="22" y1="36" x2="38" y2="36" stroke="#3A4F73" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="loading-screen__text">
      Opening your diary
      <span class="loading-screen__dots"><span></span><span></span><span></span></span>
    </p>
  </div>

  <main class="page diary-page" id="app">
    <div class="container diary-page__inner">
      <div class="diary-page__header">
        <div class="diary-page__date-section">
          <button class="diary-page__date-change" id="dateChangeBtn" type="button" aria-label="Change date">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Change Date
          </button>
          <span class="diary-page__date-display" id="diaryDateDisplay"></span>
        </div>
        <input
          type="text"
          class="diary-page__title-input"
          id="diaryTitle"
          placeholder="Enter Title Cutie..."
          aria-label="Entry title"
          maxlength="120"
        >
      </div>

      <div class="diary-page__mood-section">
        <div id="moodSelector"></div>
      </div>

      <div class="diary-page__writing-area">
        <div class="diary-page__book">
          <div class="diary-page__page-wrapper" id="pageWrapper">
            <div class="diary-page__page diary-page__page--empty" id="pageDisplay" data-placeholder="Write your thoughts here... Let them flow freely."></div>
          </div>
          <textarea
            class="diary-page__textarea"
            id="diaryContent"
            aria-label="Write your diary entry"
          ></textarea>
        </div>
        <div class="diary-page__page-nav" id="pageNav">
          <button class="diary-page__page-btn" id="prevPageBtn" type="button" disabled aria-label="Previous page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="diary-page__page-info" id="pageInfo">Page 1 of 1</span>
          <button class="diary-page__page-btn" id="nextPageBtn" type="button" aria-label="Next page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>

      <div class="diary-page__stats">
        <div class="diary-page__stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="diary-page__stat-value" id="wordCount">0</span> words
        </div>
        <div class="diary-page__stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="diary-page__stat-value" id="readingTime">0 min read</span>
        </div>
        <div class="diary-page__stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span class="diary-page__stat-value" id="charCount">0</span> characters
        </div>
      </div>

      <div class="diary-page__actions">
        <button class="btn btn--secondary" id="cancelBtn" type="button">Cancel</button>
        <button class="btn btn--primary" id="saveBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Entry
        </button>
      </div>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
  <script src="../../../utilities/firebase-service.js"></script>
  <script src="../../../utilities/helpers.js"></script>
  <script src="../../../utilities/data.js"></script>
  <script src="../../../utilities/service.js"></script>
  <script src="../../components/buttons/buttons.js"></script>
  <script src="../../components/navbar/navbar.js"></script>

  <script src="../../components/page-transition/page-transition.js"></script>
  <script src="../../components/mood-selector/mood-selector.js"></script>
  <script src="../../components/toast/toast.js"></script>
  <script src="../../components/modals/modal.js"></script>
  <script src="../../components/date-picker/date-picker.js"></script>
  <script src="diary.js"></script>
</body>
</html>
